name: Provider maintainers

# Mentions a data provider's maintainers on a pull request that changes the
# provider. Maintainers are declared in each provider's `coverage` and written
# to .github/CODEOWNERS by `npm run gen:codeowners`; this reads that file from
# the base branch.
#
# SECURITY: this runs on pull_request_target, which gives fork pull requests a
# token that can write to the repository. It therefore never checks out or runs
# the pull request's code. It reads the changed file list and the base branch's
# CODEOWNERS through the API and posts one comment. Keep it that way: do not
# add a checkout step, do not pass pull request text (title, body, branch name)
# into a `run:` step, and keep the permissions below minimal.
#
# One comment per pull request, found by its marker and updated in place, so a
# push doesn't add another. Drafts are skipped until they are marked ready.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: provider-maintainers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mention:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- provider-maintainers -->'
            const pr = context.payload.pull_request
            const { owner, repo } = context.repo
            const author = pr.user.login.toLowerCase()

            // Each provider's maintainers, from the base branch's CODEOWNERS.
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/CODEOWNERS', ref: pr.base.ref,
            })
            const codeowners = Buffer.from(file.content, 'base64').toString('utf8')
            const maintainers = new Map()
            for (const raw of codeowners.split('\n')) {
              const [path, ...owners] = raw.replace(/#.*/, '').trim().split(/\s+/)
              const match = /^\/central\/src\/providers\/([^/]+)\/$/.exec(path)
              if (match) maintainers.set(match[1], owners.filter(o => o.startsWith('@')).map(o => o.slice(1)))
            }

            // The providers this pull request changes, in source or tests.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })
            const changed = new Set()
            for (const f of files) {
              for (const name of [f.filename, f.previous_filename]) {
                const match = name && /^central\/(?:src|test)\/providers\/([^/]+)\//.exec(name)
                if (match && maintainers.has(match[1])) changed.add(match[1])
              }
            }

            // Mention each provider's maintainers other than the author.
            const join = items => items.length < 3 ? items.join(' and ') : `${items.slice(0, -1).join(', ')}, and ${items.at(-1)}`
            const lines = []
            for (const id of [...changed].sort()) {
              const who = maintainers.get(id).filter(h => h.toLowerCase() !== author).map(h => `@${h}`)
              if (who.length > 0) lines.push(`${join(who)}, this pull request changes the \`${id}\` provider, which you maintain.`)
            }
            if (lines.length === 0) return
            const body = `${MARKER}\n${lines.join('\n\n')}`

            // One comment: update it when the mentions change, never add another.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            })
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARKER))
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            }
